<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dedo Certo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: caixas coloridas flutuando sobre um fundo claro; cada etapa tem a sua cor. O teclado é um corpo escuro com teclas em relevo, coloridas por dedo. */
:root {
  --bg: #f1effb;
  --surface: #ffffff;
  --ink: #1b1c33;
  --muted: #62648a;
  --line: #dedbf2;
  --accent: #6a47f0;
  --accent-ink: #ffffff;
  --warn: #e5383b;
  --gold: #f5a700;
  --hl: #ffd84d;
  --hl-ink: #1b1c33;
  --sh: 60, 50, 140;
  --s0: #6a47f0; --s1: #1f6fe5; --s2: #0a8f6c; --s3: #e2560b; --s4: #d6336c; --s5: #f5b700;
  --on0: #fff; --on1: #fff; --on2: #fff; --on3: #fff; --on4: #fff; --on5: #2a1e00;
  --f1: #ff5fa2; --f2: #ff9a3d; --f3: #f2c200; --f4: #4fc45a;
  --f5: #25c2cf; --f6: #4d8dff; --f7: #9b7bff; --f8: #d86be0; --f9: #9aa3c2;
  --display: "Bricolage Grotesque", "Nunito", system-ui, sans-serif;
  --text: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11122a; --surface: #1d1f42; --ink: #eeeefc; --muted: #a6a8cf; --line: #30326180;
    --accent: #9a82ff; --accent-ink: #14102e; --warn: #ff6b6b; --gold: #ffc93c; --sh: 0, 0, 0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11122a; --surface: #1d1f42; --ink: #eeeefc; --muted: #a6a8cf; --line: #30326180;
  --accent: #9a82ff; --accent-ink: #14102e; --warn: #ff6b6b; --gold: #ffc93c; --sh: 0, 0, 0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; color: var(--ink); font: 500 16px/1.55 var(--text);
  background:
    radial-gradient(60rem 28rem at 8% -8%, color-mix(in srgb, var(--s1) 20%, transparent), transparent 70%),
    radial-gradient(48rem 26rem at 100% 0%, color-mix(in srgb, var(--s4) 16%, transparent), transparent 70%),
    radial-gradient(50rem 30rem at 50% 110%, color-mix(in srgb, var(--s0) 14%, transparent), transparent 70%),
    var(--bg);
  background-attachment: fixed;
}
.wrap {
  max-width: 940px; margin: 0 auto; padding-block: 22px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 26px;
}
#app { display: flex; flex-direction: column; gap: 26px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.col { display: flex; flex-direction: column; gap: 14px; }

/* topo */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font: 800 1.5rem var(--display); letter-spacing: -0.02em; }
.brand span { color: var(--accent); }
.top small { color: var(--muted); font-size: .8rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  background: var(--surface); padding: 6px 14px; border-radius: 99px; box-shadow: 0 6px 16px -8px rgba(var(--sh), .4); }

/* botões */
.btn {
  border: 0; background: var(--surface); border-radius: 14px; padding: 12px 22px; font-weight: 800;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--ink) 16%, var(--surface)), 0 12px 20px -10px rgba(var(--sh), .45);
  transition: transform .08s, box-shadow .08s;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--ink) 16%, var(--surface)); }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 65%, #000), 0 14px 22px -10px color-mix(in srgb, var(--accent) 70%, transparent); }
.btn.white { background: #fff; color: #2a1c7a; box-shadow: 0 4px 0 rgba(0, 0, 0, .25), 0 14px 22px -10px rgba(0, 0, 0, .5); }
.btn.quiet { background: transparent; box-shadow: none; color: var(--muted); padding: 8px 6px; }
.btn.quiet:hover { color: var(--ink); transform: none; }

/* início */
.hero {
  display: flex; flex-direction: column; gap: 14px; align-items: flex-start;
  padding: clamp(22px, 5vw, 40px); border-radius: 28px; color: #fff;
  background: linear-gradient(135deg, #7b5cff 0%, #5b3fe6 45%, #1f6fe5 100%);
  box-shadow: 0 30px 50px -24px rgba(70, 50, 200, .75), inset 0 1px 0 rgba(255, 255, 255, .3);
}
.hero h1 { font-size: clamp(1.9rem, 5.4vw, 3rem); font-weight: 800; letter-spacing: -0.02em; }
.hero p { max-width: 60ch; font-size: 1.05rem; opacity: .93; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin: 0; }
.stats div {
  --c: var(--s0); display: flex; flex-direction: column; gap: 2px; padding: 16px 18px; border-radius: 20px; color: #fff;
  background: linear-gradient(150deg, color-mix(in srgb, var(--c) 82%, #fff), var(--c) 70%);
  box-shadow: 0 18px 28px -16px color-mix(in srgb, var(--c) 80%, transparent), inset 0 1px 0 rgba(255, 255, 255, .35);
}
.stats div:nth-child(2) { --c: var(--s2); }
.stats div:nth-child(3) { --c: var(--s3); }
.stats div:nth-child(4) { --c: var(--s4); }
.stats dt { font-size: .74rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .9; }
.stats dd { margin: 0; font: 800 1.8rem var(--display); }
.stats dd small { font-size: .95rem; opacity: .8; }

.stage { display: flex; flex-direction: column; gap: 14px; }
.stage h2 { font-size: 1.25rem; font-weight: 800; display: flex; gap: 10px; align-items: center; }
.stage h2 i { width: 14px; height: 14px; border-radius: 5px; background: var(--c); box-shadow: 0 3px 0 color-mix(in srgb, var(--c) 65%, #000); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; }
.lv {
  border: 0; text-align: left; min-width: 0; color: var(--on);
  display: flex; flex-direction: column; gap: 6px; padding: 16px 18px 18px; border-radius: 22px;
  background: linear-gradient(150deg, color-mix(in srgb, var(--c) 80%, #fff) 0%, var(--c) 55%, color-mix(in srgb, var(--c) 86%, #000) 100%);
  box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 62%, #000), 0 24px 30px -16px color-mix(in srgb, var(--c) 85%, transparent), inset 0 1px 0 rgba(255, 255, 255, .4);
  transition: transform .12s, box-shadow .12s;
}
.lv:hover:not(:disabled) { transform: translateY(-5px) rotate(-.6deg); }
.lv:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 62%, #000); }
.lv .n { font: 800 2.2rem/1 var(--display); opacity: .95; }
.lv .t { font-weight: 800; font-size: 1.05rem; line-height: 1.25; flex: 1; }
.lv .g { font-size: .84rem; opacity: .9; }
.lv .s { font-size: .84rem; font-weight: 800; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  background: rgba(0, 0, 0, .16); border-radius: 10px; padding: 5px 10px; }
.lv.next { outline: 4px solid var(--hl); outline-offset: 3px; }
.lv:disabled { cursor: not-allowed; opacity: .55; filter: saturate(.7); box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 62%, #000); }
.stars { color: var(--gold); letter-spacing: 2px; font-size: 1rem; }
.stars i { font-style: normal; opacity: .3; }
.lv .stars { color: var(--on); }
.foot { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; color: var(--muted); font-size: .92rem; }
.foot label { display: flex; gap: 8px; align-items: center; cursor: pointer; }

/* nível */
.lvhead {
  display: flex; flex-direction: column; gap: 6px; padding: 18px clamp(18px, 4vw, 30px) 24px; border-radius: 26px; color: var(--on);
  background: linear-gradient(140deg, color-mix(in srgb, var(--c) 80%, #fff) 0%, var(--c) 55%, color-mix(in srgb, var(--c) 82%, #000) 100%);
  box-shadow: 0 26px 40px -22px color-mix(in srgb, var(--c) 90%, transparent), inset 0 1px 0 rgba(255, 255, 255, .35);
}
.lvhead .btn.quiet { color: inherit; opacity: .85; margin-left: -6px; }
.lvhead .btn.quiet:hover { opacity: 1; color: inherit; }
.crumb { font-size: .8rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .88; }
.lvhead h1 { font-size: clamp(1.7rem, 4.6vw, 2.5rem); font-weight: 800; letter-spacing: -0.02em; }
.lesson { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; }
.lesson > div {
  min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 18px 20px; border-radius: 22px;
  background: var(--surface); box-shadow: 0 22px 34px -20px rgba(var(--sh), .5), 0 2px 6px rgba(var(--sh), .06);
  border-top: 6px solid var(--s1);
}
.lesson .tip { border-top-color: var(--s5); }
.lesson h3 { font: 800 .76rem var(--text); letter-spacing: .08em; text-transform: uppercase; color: var(--s1); }
.lesson .tip h3 { color: color-mix(in srgb, var(--s5) 70%, var(--ink)); }
.goal { color: var(--muted); font-size: .95rem; }
.goal b { color: var(--ink); }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; font-size: .9rem; font-weight: 800; color: var(--muted); }
.steps li { padding: 8px 16px; border-radius: 99px; background: var(--surface); box-shadow: 0 8px 14px -10px rgba(var(--sh), .5); }
.steps li.on { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 60%, #000), 0 14px 18px -10px color-mix(in srgb, var(--accent) 80%, transparent); transform: translateY(-2px); }
.steps li.ok { background: color-mix(in srgb, var(--s2) 20%, var(--surface)); color: color-mix(in srgb, var(--s2) 75%, var(--ink)); }

.panel, .result {
  display: flex; flex-direction: column; gap: 14px; padding: clamp(18px, 4vw, 28px); border-radius: 24px;
  background: var(--surface); box-shadow: 0 28px 44px -24px rgba(var(--sh), .55), 0 2px 6px rgba(var(--sh), .06);
}
.panel p, .result p { max-width: 64ch; }
.say { font: 800 1.3rem var(--display); }
.chk { font: 700 1.05rem var(--mono); width: 2.8rem; height: 2.8rem; display: grid; place-items: center; border-radius: 10px; color: var(--muted);
  background: color-mix(in srgb, var(--ink) 7%, var(--surface)); box-shadow: 0 4px 0 color-mix(in srgb, var(--ink) 18%, var(--surface)); }
.chk.ok { background: var(--s2); color: #fff; box-shadow: 0 1px 0 color-mix(in srgb, var(--s2) 60%, #000); transform: translateY(3px); }

.meters { display: flex; flex-wrap: wrap; gap: 12px; }
.meters span { display: flex; align-items: baseline; gap: 6px; color: var(--muted); font-size: .85rem; font-weight: 700;
  background: var(--surface); padding: 8px 16px; border-radius: 14px; box-shadow: 0 10px 16px -12px rgba(var(--sh), .5); }
.meters b { font: 800 1.35rem var(--display); color: var(--ink); }
.bar { height: 10px; background: color-mix(in srgb, var(--ink) 10%, var(--surface)); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--s0), var(--s4), var(--s5)); transition: width .15s; }

.pad {
  position: relative; background: var(--surface); border-radius: 24px; padding: clamp(18px, 4vw, 30px); min-height: 7rem;
  box-shadow: 0 30px 46px -24px rgba(var(--sh), .6), 0 2px 6px rgba(var(--sh), .06); border: 3px solid transparent;
}
.pad:focus-within { border-color: var(--accent); }
.txt { font: 400 clamp(1.15rem, 2.8vw, 1.6rem)/1.8 var(--mono); white-space: pre-wrap; overflow-wrap: break-word; }
.txt span { border-radius: 5px; }
.txt .done { color: var(--s2); opacity: .75; }
.txt .miss { text-decoration: underline; text-decoration-color: var(--warn); text-decoration-thickness: 3px; text-underline-offset: 5px; opacity: 1; }
.txt .cur { background: var(--hl); color: var(--hl-ink); box-shadow: 0 3px 0 #c79a00; }
.txt .cur.bad { background: var(--warn); color: #fff; box-shadow: 0 3px 0 #8f1d1f; }
#inp { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; font-size: 16px; cursor: text; }
.veil {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 12px;
  background: color-mix(in srgb, var(--surface) 88%, transparent); border-radius: 22px; font-weight: 800; pointer-events: none;
}
.pad:focus-within .veil { display: none; }
.hint { min-height: 1.6em; color: var(--muted); font-size: 1rem; font-weight: 600; }
.hint b { color: var(--ink); font-family: var(--mono); background: var(--hl); color: var(--hl-ink); padding: 1px 7px; border-radius: 6px; }

/* teclado ABNT2 em relevo */
.kbwrap { display: flex; flex-direction: column; gap: 12px; max-width: 800px; width: 100%; margin: 0 auto; }
.kbpos { position: relative; padding-bottom: 36px; }
.kb {
  --d: clamp(2px, .75vw, 6px);
  display: flex; flex-direction: column; gap: clamp(3px, .8vw, 7px);
  padding: clamp(7px, 1.8vw, 16px); padding-bottom: calc(clamp(7px, 1.8vw, 16px) + var(--d));
  border-radius: clamp(10px, 2.4vw, 22px);
  background: linear-gradient(180deg, #3a4064 0%, #262b47 18%, #1b1f36 100%);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .22), inset 0 -3px 6px rgba(0, 0, 0, .5),
    0 clamp(5px, 1.2vw, 10px) 0 #10132a, 0 40px 50px -22px rgba(20, 16, 70, .75);
}
.kr { display: flex; gap: clamp(3px, .8vw, 7px); }
.k {
  --kc: var(--fc, #9aa3c2);
  --top: color-mix(in srgb, var(--kc) 58%, #fff);
  --side: color-mix(in srgb, var(--kc) 62%, #101020);
  flex: var(--w) 1 0; min-width: 0; height: clamp(26px, 5.8vw, 50px);
  background: linear-gradient(180deg, color-mix(in srgb, var(--top) 72%, #fff) 0%, var(--top) 55%, color-mix(in srgb, var(--top) 90%, #000) 100%);
  border-radius: clamp(4px, .9vw, 8px); color: #1b1c33;
  box-shadow: 0 var(--d) 0 var(--side), 0 calc(var(--d) + 2px) 3px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .8), inset 0 -2px 2px rgba(0, 0, 0, .1);
  font: 700 clamp(9px, 2vw, 15px)/1 var(--mono);
  display: grid; place-items: center; position: relative;
  transition: transform .06s, box-shadow .06s;
}
.k sup { position: absolute; top: 3px; left: 5px; font-size: .7em; font-weight: 600; color: rgba(20, 20, 50, .6); }
.k.sp { font-size: clamp(7px, 1.3vw, 11px); font-weight: 600; color: rgba(20, 20, 50, .7); }
.k.home::after { content: ""; position: absolute; bottom: 14%; width: 34%; height: 3px; border-radius: 2px; background: rgba(20, 20, 50, .55); box-shadow: 0 1px 0 rgba(255, 255, 255, .6); }
.k.go2 { outline: 2px dashed var(--hl); outline-offset: 2px; }
.k.go {
  --top: #ffe566; --side: #b98a00; z-index: 1;
  box-shadow: 0 var(--d) 0 var(--side), 0 calc(var(--d) + 2px) 3px rgba(0, 0, 0, .55), inset 0 1px 0 #fff, 0 0 0 3px rgba(255, 229, 102, .5), 0 0 22px 6px rgba(255, 214, 0, .65);
  animation: glow 1s ease-in-out infinite alternate;
}
@keyframes glow { to { filter: brightness(1.12); } }
.k.down { transform: translateY(var(--d)); box-shadow: 0 0 0 var(--side), inset 0 2px 4px rgba(0, 0, 0, .35); animation: none; }
.hands { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 2; }
.palm { fill: #8d93ad; opacity: .38; }
.fl { stroke-linecap: round; opacity: .5; }
.ft { fill-opacity: .35; stroke-width: 2; }
.ft.act { fill-opacity: 0; stroke: #1b1c33 !important; stroke-width: 3.5; }
.fingers { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; }
.fingers div { display: flex; gap: 6px; }
.fg { font-size: .74rem; font-weight: 800; padding: 3px 10px; border-radius: 99px; color: #1b1c33;
  background: color-mix(in srgb, var(--fc) 55%, #fff); box-shadow: 0 3px 0 color-mix(in srgb, var(--fc) 62%, #101020); }
.fg.on { background: var(--hl); box-shadow: 0 3px 0 #b98a00, 0 0 14px 2px rgba(255, 214, 0, .6); }

/* resultado */
.result h2 { font-size: 1.7rem; font-weight: 800; }
.result .stars { font-size: 2rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Dedo<span>Certo</span></div>
    <small>Digitação · teclado ABNT2</small>
  </header>
  <main id="app"></main>
</div>
<script>

];
var FINGER = ['', 'mínimo esquerdo', 'anelar esquerdo', 'médio esquerdo', 'indicador esquerdo', 'indicador direito', 'médio direito', 'anelar direito', 'mínimo direito', 'polegar'];

var MAP = {};
ROWS.forEach(function (row) { row.forEach(function (k) {
  if (!k[4]) return;
  if (k[0] === 'Space') { MAP[' '] = { code: 'Space', shift: false, finger: 9, label: 'espaço' }; return; }

/* ---------- Gerador de exercícios ---------- */
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function lettersUpTo(i) { var s = ''; for (var x = 0; x <= i; x++) if (LEVELS[x].m === 'keys') s += LEVELS[x].k; return s; }
function allowedWords(set) { return WORDS.filter(function (w) { for (var i = 0; i < w.length; i++) if (set.indexOf(w[i]) < 0) return false; return true; }); }
function fill(len, next) {
  var out = [], size = 0, last = '';
  while (size < len) { var t = next(); if (t === last) continue; last = t; out.push(t); size += t.length + 1; }
  return out.join(' ');
}
function drill(nw, known, len) {
  var parts = [];
  nw.split('').forEach(function (c) { if (/[a-zç]/.test(c)) parts.push(c + c + c); });
  if (nw.length >= 2) { parts.push(nw[0] + nw[1] + nw[0], nw[1] + nw[0] + nw[1]); }
  var head = parts.join(' ');
  var rest = fill(Math.max(10, len - head.length), function () {
    var n = 2 + Math.floor(Math.random() * 3), g = '';
    for (var i = 0; i < n; i++) {
      var c = (!known || Math.random() < 0.6) ? pick(nw.split('')) : pick(known.split(''));
      if (/[,.;]/.test(c) && i === 0) c = pick((known || nw).replace(/[,.;]/g, '').split(''));
      g += c;
    }
    return g;
  });
  return (head ? head + ' ' : '') + rest;
}
function makeText(i) {
  var L = LEVELS[i], set, pool;
  if (L.m === 'keys') {
    set = lettersUpTo(i);
    var known = set.slice(0, set.length - L.k.length);
    var punct = L.k.replace(/[a-zç]/g, '');
    var all = allowedWords(set);
    pool = all.filter(function (w) { for (var j = 0; j < L.k.length; j++) if (w.indexOf(L.k[j]) >= 0) return true; return false; });
    if (pool.length < 5) return drill(L.k, known, L.n);
    var d = drill(L.k, known, Math.round(L.n * 0.4));
    var w = fill(Math.round(L.n * 0.6), function () {
      var x = Math.random() < 0.7 ? pick(pool) : pick(all);
      if (punct && Math.random() < 0.3) x += pick(punct.split(''));
      return x;
    });
    return d + ' ' + w.replace(/[,;]$/, '');
  }
  if (L.m === 'review') { pool = allowedWords(lettersUpTo(i)); return fill(L.n, function () { return pick(pool); }); }
  if (L.m === 'caps') return fill(L.n, function () { return pick(CAPS); });
  if (L.m === 'acc1') {
    pool = WORDS.filter(function (w) { return /[áéíóúãõ]/.test(w) && !/[âêôà]/.test(w); });
    var plain = allowedWords('abcdefghijklmnopqrstuvwxyzç');
    return fill(L.n, function () { return Math.random() < 0.75 ? pick(pool) : pick(plain); });
  }
  if (L.m === 'acc2') {
    pool = WORDS.filter(function (w) { return /[âêôà]/.test(w); });
    return fill(L.n, function () { return Math.random() < 0.4 ? pick(pool) : pick(ACC2); });
  }
  if (L.m === 'num') {
    var wd = ['dias', 'anos', 'reais', 'itens', 'horas', 'pessoas', 'casa', 'sala', 'km', 'de maio', 'de julho'];
    return fill(L.n, function () {
      var n = String(Math.floor(Math.random() * Math.pow(10, 1 + Math.floor(Math.random() * 4))));
      return Math.random() < 0.4 ? n + ' ' + pick(wd) : n;
    });
  }
  if (L.m === 'sym') return fill(L.n, function () { return pick(SYM); });
  var q = shuffle(SENT), out = '';
  while (out.length < L.n && q.length) out += (out ? ' ' : '') + q.pop();
  return out;
}

var CALM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function buildHands() {

  H = { box: box, f: {}, palms: [], raf: 0 };
  for (var n = 0; n < 2; n++) { var r = document.createElementNS(ns, 'rect'); r.setAttribute('class', 'palm'); svg.appendChild(r); H.palms.push(r); }
  ['1', '2', '3', '4', 'tl', 'tr', '5', '6', '7', '8'].forEach(function (id) {

    var c = document.createElementNS(ns, 'circle'); c.setAttribute('class', 'ft'); c.style.fill = col; c.style.stroke = col;
    svg.appendChild(ln); svg.appendChild(c);

function kc(code, fx) {

  var a = el.getBoundingClientRect(), b = H.box.getBoundingClientRect();

}
function homePos(id) { return id === 'tl' ? kc('Space', 0.37) : id === 'tr' ? kc('Space', 0.55) : kc(HOME[id]); }

  if (!H || !H.box.isConnected) return;
  var a = kc('KeyA'); if (!a || !a.w) return;
  var bh = H.box.getBoundingClientRect().height, sp = kc('Space'), top = sp.y - a.h * 0.15;
  [[1, 4], [5, 8]].forEach(function (p, n) {
    var l = kc(HOME[p[0]]), r = kc(HOME[p[1]]), e = H.palms[n];
    e.setAttribute('x', l.x - a.w * 0.6); e.setAttribute('y', top);
    e.setAttribute('width', r.x - l.x + a.w * 1.2); e.setAttribute('height', Math.max(4, bh - top));
    e.setAttribute('rx', a.w * 0.7);
  });
  Object.keys(H.f).forEach(function (id) {
    var f = H.f[id], hp = homePos(id), thumb = id.length > 1;
    f.ln.setAttribute('x1', thumb ? kc(id === 'tl' ? 'KeyF' : 'KeyJ').x : hp.x);
    f.ln.setAttribute('y1', sp.y + a.h * (thumb ? 0.45 : 0.25));
    f.ln.setAttribute('stroke-width', a.w * 0.5); f.c.setAttribute('r', a.w * 0.3);
    var t = (f.code && kc(f.code)) || hp; f.tx = t.x; f.ty = t.y;
    if (snap || !f.init || CALM) { f.x = f.tx; f.y = f.ty; f.init = true; }

}
function tick() {
  if (!H) return;
  cancelAnimationFrame(H.raf);
  var moving = false;
  Object.keys(H.f).forEach(function (id) {
    var f = H.f[id], dx = f.tx - f.x, dy = f.ty - f.y;
    if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) { f.x += dx * 0.3; f.y += dy * 0.3; moving = true; } else { f.x = f.tx; f.y = f.ty; }
    f.ln.setAttribute('x2', f.x); f.ln.setAttribute('y2', f.y); f.c.setAttribute('cx', f.x); f.c.setAttribute('cy', f.y);
  });

}
/* Mostra no teclado a tecla k (e, apagada, a tecla ghost que vem depois de um acento). k nulo = mãos na posição base. */
function guide(k, ghost) {
  document.querySelectorAll('.k').forEach(function (e) { e.classList.remove('go', 'go2'); });
  document.querySelectorAll('.fg').forEach(function (e) { e.classList.remove('on'); });
  var t = {}, act = [];
  function mark(code, cls) { var el = document.querySelector('.k[data-code="' + code + '"]'); if (el) el.classList.add(cls); return el; }
  var els = [];
  if (k) {
    els.push(mark(k.code, 'go'));
    if (k.finger === 9) act.push('tr'); else { t[k.finger] = k.code; act.push(String(k.finger)); }
    if (k.shift) { var sf = k.finger <= 4 ? 8 : 1, sc = sf === 8 ? 'ShiftRight' : 'ShiftLeft'; els.push(mark(sc, 'go')); t[sf] = sc; act.push(String(sf)); }
    if (ghost) mark(ghost.code, 'go2');
    document.querySelectorAll('.fg').forEach(function (e) { if (+e.dataset.f === k.finger) e.classList.add('on'); });
  }
  if (H) { Object.keys(H.f).forEach(function (id) { H.f[id].code = t[id] || null; H.f[id].c.classList.toggle('act', act.indexOf(id) >= 0); }); layoutHands(false); }

}
function desc(k) { return (k.shift ? 'Shift ' + (k.finger <= 4 ? 'direito' : 'esquerdo') + ' + ' : '') + '<b>' + esc(k.label) + '</b> (' + FINGER[k.finger] + ')'; }

/* ---------- Tela do nível ---------- */
function kbHtml() {
  var h = '<div class="kbpos" id="kbpos"><div class="kb" aria-hidden="true">';
  ROWS.forEach(function (row) {
    h += '<div class="kr">';
    row.forEach(function (k) {
      var sp = !k[4] || k[0] === 'Space';
      var lab = k[0] === 'Space' ? '' : (sp ? k[1] : k[1].toUpperCase());
      h += '<div class="k' + (sp ? ' sp' : '') + (k[0] === 'KeyF' || k[0] === 'KeyJ' ? ' home' : '') + '" data-code="' + k[0] + '" style="--w:' + k[3] + (k[4] ? ';--fc:var(--f' + k[4] + ')' : '') + '">' +
        (k[2] ? '<sup>' + esc(k[2]) + '</sup>' : '') + esc(lab) + '</div>';
    });
    h += '</div>';
  });
  h += '</div></div><div class="fingers" aria-hidden="true"><div>';
  for (var f = 1; f <= 8; f++) { h += '<span class="fg" data-f="' + f + '" style="--fc:var(--f' + f + ')">' + FSHORT[f] + '</span>'; if (f === 4) h += '</div><span class="fg" data-f="9" style="--fc:var(--f9)">' + FSHORT[9] + '</span><div>'; }
  return h + '</div></div>';
}
var STEPS = ['pos', 'demo', 'copy', 'test'];
function setStep(s) {
  var n = STEPS.indexOf(s);
  document.querySelectorAll('.steps li').forEach(function (li, x) { li.className = x === n ? 'on' : (x < n ? 'ok' : ''); });
  var box = document.getElementById('kbbox'), kbt = document.getElementById('kbt');
  if (!box) return;
  var show = S.kb || n < 2; /* na posição e na demonstração o teclado sempre aparece */
  box.hidden = !show; kbt.hidden = n < 2;
  kbt.textContent = S.kb ? 'Esconder o teclado (treino sem cola)' : 'Mostrar o teclado';
  if (show) layoutHands(true);
}
function level(i) {
  var L = LEVELS[i];
  app.innerHTML = '<div class="lvhead" style="--c:var(--s' + L.st + ');--on:var(--on' + L.st + ')"><div class="row"><button class="btn quiet" id="back">← Todos os níveis</button></div>' +
    '<div class="crumb">Nível ' + (i + 1) + ' de ' + LEVELS.length + ' · ' + STAGES[L.st] + '</div><h1>' + esc(L.t) + '</h1></div>' +
    '<div class="lesson"><div><h3>O que é novo</h3><p>' + esc(L.l) + '</p></div>' +

}

/* Passo 1: posição das mãos */
function stepPos(i) {
  R = { i: i, step: 'pos', f: false, j: false };
  document.getElementById('stage').innerHTML = '<div class="panel"><p class="say">Primeiro, as mãos no lugar.</p>' +
    '<p>Indicador esquerdo no <b>F</b>, indicador direito no <b>J</b>: sinta o relevo dessas duas teclas. Os outros dedos caem ao lado, em <b>A S D</b> e <b>K L Ç</b>. Os dois polegares ficam soltos sobre a barra de espaço. O desenho no teclado abaixo mostra cada dedo na sua tecla.</p>' +
    '<p>Sem olhar para as mãos, aperte <b>F</b> e depois <b>J</b> para confirmar.</p>' +
    '<div class="row"><span class="chk" id="cf">F</span><span class="chk" id="cj">J</span>' +
    '<button class="btn" id="posok">Já estou na posição</button></div></div>';
  document.getElementById('posok').onclick = function () { stepDemo(i); };
  setStep('pos');

  ['KeyF', 'KeyJ'].forEach(function (c) { var el = document.querySelector('.k[data-code="' + c + '"]'); if (el) el.classList.add('go'); });
}
function posKey(e) {
  var k = (e.key || '').toLowerCase();
  if (e.code === 'KeyF' || k === 'f') R.f = true;
  if (e.code === 'KeyJ' || k === 'j') R.j = true;
  var cf = document.getElementById('cf'), cj = document.getElementById('cj');
  if (cf) cf.classList.toggle('ok', R.f); if (cj) cj.classList.toggle('ok', R.j);
  if (R.f && R.j && !R.go) { R.go = true; var i = R.i; setTimeout(function () { if (R && R.step === 'pos' && R.i === i) stepDemo(i); }, 450); }
}

/* Passo 2: o aplicativo digita primeiro */
function demoText(i) {
  var L = LEVELS[i];
  if (L.m === 'keys') {
    var ltr = L.k.replace(/[^a-zç]/g, '').split(''), pun = L.k.replace(/[a-zç]/g, '').split('');
    var s = ltr.map(function (c) { return c + c + c; }).join(' ');
    if (ltr.length >= 2) s += ' ' + ltr[0] + ltr[1] + ltr[0] + ' ' + ltr[1] + ltr[0] + ltr[1];
    pun.forEach(function (p) { s += ' ' + ltr[0] + p; });
    return s;
  }
  return { review: 'que tal hoje', caps: 'Ana e Lucas', acc1: 'está não', acc2: 'você às três?', num: '10 25 2026', sym: '(a-b) "ok" @', sent: 'O ritmo é tudo.' }[L.m];
}
function padHtml(withInput) {
  return '<div class="pad"><div class="txt" id="txt"></div>' +
    (withInput ? '<input id="inp" type="text" aria-label="Digite o texto mostrado" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"><div class="veil">Clique aqui ou aperte qualquer tecla para continuar</div>' : '') +
    '</div><div class="hint" id="hint"></div>';
}
function fillTxt(text) {
  var txt = document.getElementById('txt'), spans = [];
  for (var c = 0; c < text.length; c++) { var sp = document.createElement('span'); sp.textContent = text[c]; txt.appendChild(sp); spans.push(sp); }
  return spans;
}
function stepDemo(i) {
  var text = demoText(i), fast = LEVELS[i].m === 'sent';
  document.getElementById('stage').innerHTML = '<div class="col"><p class="say">Observe: eu faço primeiro.</p>' + padHtml(false) +
    '<div class="row"><button class="btn quiet" id="skip">Pular a demonstração</button></div></div>';
  var spans = fillTxt(text);
  R = { i: i, step: 'demo', text: text };
  var me = R, hint = document.getElementById('hint'), seq = [];
  document.getElementById('skip').onclick = function () { begin(i, text, 'copy'); };
  setStep('demo');
  for (var c = 0; c < text.length; c++) {
    var info = keyInfo(text[c]); if (!info) continue;
    if (info.dead) seq.push({ k: info.dead, ghost: info.main, at: c, fin: false });
    seq.push({ k: info.main, at: c, fin: true });
  }
  var T1 = fast ? 240 : 460, T2 = fast ? 130 : 240;
  function alive() { return R === me && document.getElementById('skip'); }
  function next(n) {
    if (!alive()) return;
    if (n >= seq.length) { guide(null); hint.innerHTML = 'Pronto. Agora é a sua vez.'; setTimeout(function () { if (alive()) begin(i, text, 'copy'); }, 900); return; }
    var s = seq[n];
    spans[s.at].className = 'cur';
    var els = guide(s.k, s.ghost);
    hint.innerHTML = 'Eu aperto ' + desc(s.k) + (s.ghost ? ' e nada aparece ainda' : '');
    setTimeout(function () {
      if (!alive()) return;
      els.forEach(function (e) { if (e) e.classList.add('down'); });

      setTimeout(function () {
        els.forEach(function (e) { if (e) e.classList.remove('down'); });
        if (!alive()) return;

/* Passos 3 e 4: o aluno digita (copy = repetir a demonstração, test = exercício valendo a meta) */
function start(i) { begin(i, makeText(i), 'test'); }
function begin(i, text, mode) {
  var L = LEVELS[i], test = mode === 'test';
  document.getElementById('stage').innerHTML = '<div class="col">' +
    (test ? '<p class="say">Agora o exercício completo.</p><p class="goal">Meta para liberar o próximo nível: <b>' + L.w + ' PPM</b> com <b>' + L.a + '%</b> de precisão. A tecla errada não avança: corrija e siga.</p>' +
      '<div class="meters"><span><b class="num" id="mw">0</b>PPM</span><span><b class="num" id="ma">100%</b>precisão</span><span><b class="num" id="mt">0:00</b>tempo</span></div><div class="bar"><i id="mb"></i></div>'
      : '<p class="say">Sua vez: repita o que eu fiz, com os mesmos dedos.</p>') +
    padHtml(true) +
    (test ? '' : '<div class="row"><button class="btn quiet" id="again2">Ver a demonstração de novo</button></div>') + '</div>';
  if (!test) document.getElementById('again2').onclick = function () { stepDemo(i); };
  R = { i: i, step: mode, text: text, spans: fillTxt(text), idx: 0, ok: 0, err: 0, miss: {}, t0: 0, dead: false, used: 0, done: false,
        inp: document.getElementById('inp'), timer: null };
  R.inp.addEventListener('input', onInput);
  R.inp.addEventListener('compositionend', function () { R.inp.value = ''; R.used = 0; });
  setStep(mode);
  paint();
  R.inp.focus({ preventScroll: true });
}
function copyDone() {
  var i = R.i, errs = R.err;
  R.done = true; clearInterval(R.timer);
  guide(null);
  document.getElementById('stage').innerHTML = '<div class="panel"><p class="say">' + (errs ? 'Feito, com ' + errs + (errs === 1 ? ' tecla errada' : ' teclas erradas') + ' no caminho.' : 'Isso. Mesmos dedos, mesmo caminho.') + '</p>' +
    '<p>Agora vem o exercício completo deste nível, com a meta de velocidade e precisão. As mãos no teclado continuam mostrando qual dedo usar.</p>' +
    '<div class="row"><button class="btn primary" id="gotest">Começar o exercício</button><button class="btn" id="redo">Ver a demonstração de novo</button></div></div>';
  document.getElementById('gotest').onclick = function () { start(i); };
  document.getElementById('redo').onclick = function () { stepDemo(i); };
  document.getElementById('gotest').focus();
}

function onInput(e) {
  if (!R || R.done) return;
  var inp = R.inp, v = inp.value.normalize('NFC');
  if (v.length < R.used) R.used = v.length;
  var fresh = v.slice(R.used);
  if (e.isComposing) {
    if (fresh && DEADS_SET.indexOf(fresh[fresh.length - 1]) >= 0) return; /* acento esperando a letra */
    R.used = v.length;
  } else { inp.value = ''; R.used = 0; }
  for (var j = 0; j < fresh.length; j++) if (!type(fresh[j])) break;
  R.dead = false;
  paint();
  if (R.idx >= R.text.length) { if (R.step === 'copy') copyDone(); else finish(); }
}
var DEADS_SET = ['´', '`', '~', '^', '¨'];

function type(ch) {
  if (R.idx >= R.text.length) return false;
  if (!R.t0) { R.t0 = performance.now(); R.timer = setInterval(meters, 400); }
  if (ch === ' ') ch = ' ';
  var want = R.text[R.idx], sp = R.spans[R.idx];
  if (ch === want) { R.ok++; sp.className = 'done' + (sp.dataset.m ? ' miss' : ''); R.idx++; return true; }
  R.err++; R.miss[want] = (R.miss[want] || 0) + 1; sp.dataset.m = '1'; R.bad = true;
  return false;
}

function stats() {
  var min = R.t0 ? (performance.now() - R.t0) / 60000 : 0;
  var tot = R.ok + R.err;
  return { wpm: min > 0 ? Math.round(R.idx / 5 / min) : 0, acc: tot ? Math.round(R.ok / tot * 100) : 100, sec: Math.round(min * 60) };
}
function meters() {
  if (!R || !R.spans || !document.getElementById('mw')) return;
  var s = stats();
  document.getElementById('mw').textContent = s.wpm;
  document.getElementById('ma').textContent = s.acc + '%';
  document.getElementById('mt').textContent = Math.floor(s.sec / 60) + ':' + ('0' + s.sec % 60).slice(-2);
  document.getElementById('mb').style.width = (R.idx / R.text.length * 100) + '%';
}

function paint() {
  if (!R || !R.spans) return;
  var cur = R.spans[R.idx], hint = document.getElementById('hint');
  R.spans.forEach(function (s) { if (s.classList.contains('cur')) s.className = ''; });
  if (cur) {
    cur.className = 'cur' + (R.bad ? ' bad' : '');
    if (R.bad) { var c0 = cur; setTimeout(function () { c0.classList.remove('bad'); }, 220); }
    if (cur.scrollIntoView && (cur.getBoundingClientRect().bottom > innerHeight || cur.getBoundingClientRect().top < 0)) cur.scrollIntoView({ block: 'center' });
  }
  R.bad = false;
  meters();
  var info = cur && keyInfo(R.text[R.idx]);
  if (!info) { guide(null); if (hint) hint.textContent = ''; return; }
  var first = info.dead && !R.dead;
  guide(first ? info.dead : info.main, first ? info.main : null);
  hint.innerHTML = info.dead
    ? 'Para <b>' + esc(R.text[R.idx]) + '</b>: primeiro ' + desc(info.dead) + ', depois ' + desc(info.main)
    : 'Próxima tecla: ' + desc(info.main);
}

function finish() {
  R.done = true; clearInterval(R.timer);
  var s = stats(), L = LEVELS[R.i], i = R.i;
  var ok = s.wpm >= L.w && s.acc >= L.a, stars = 0;
  if (ok) { stars = 1; if (s.wpm >= L.w * 1.25 && s.acc >= L.a + 2) stars = 2; if (s.wpm >= L.w * 1.5 && s.acc >= 98) stars = 3; }
  var b = S.best[i];
  if (!b || stars > b.stars || (stars === b.stars && s.wpm > b.wpm)) { S.best[i] = { wpm: s.wpm, acc: s.acc, stars: stars }; save(); }
  var worst = Object.keys(R.miss).sort(function (a, c) { return R.miss[c] - R.miss[a]; }).slice(0, 4);
  var last = i === LEVELS.length - 1, title, msg;
  if (ok && last) { title = 'Nível máximo concluído'; msg = 'Você chegou ao topo da trilha. Para manter o ritmo, repita este nível de vez em quando: o texto muda a cada tentativa.'; }
  else if (ok) { title = 'Meta atingida'; msg = stars === 3 ? 'Três estrelas. Você está pronto para o próximo nível.' : 'O próximo nível está liberado. Para mais estrelas, repita com mais velocidade mantendo a precisão.'; }
  else if (s.acc < L.a) { title = 'Ainda não: faltou precisão'; msg = 'Sua precisão foi de ' + s.acc + '% e a meta é ' + L.a + '%. Repita mais devagar, de propósito. Quando os erros somem, a velocidade sobe sem esforço.'; }
  else { title = 'Ainda não: faltou velocidade'; msg = 'Você fez ' + s.wpm + ' PPM e a meta é ' + L.w + '. A precisão está boa, então mantenha o toque e busque um ritmo contínuo, sem pausas entre as palavras.'; }
  var canNext = !last && unlocked(i + 1);
  document.getElementById('stage').innerHTML = '<div class="result" role="status"><div>' + starsHtml(stars) + '<h2>' + title + '</h2></div>' +
    '<dl class="stats"><div><dt>Velocidade</dt><dd class="num">' + s.wpm + ' PPM</dd></div><div><dt>Precisão</dt><dd class="num">' + s.acc + '%</dd></div>' +
    '<div><dt>Tempo</dt><dd class="num">' + Math.floor(s.sec / 60) + ':' + ('0' + s.sec % 60).slice(-2) + '</dd></div><div><dt>Erros</dt><dd class="num">' + R.err + '</dd></div></dl>' +
    '<p>' + msg + '</p>' +
    (worst.length ? '<p class="goal">Teclas que mais custaram: ' + worst.map(function (c) { return '<b style="font-family:var(--mono)">' + (c === ' ' ? 'espaço' : esc(c)) + '</b> (' + R.miss[c] + ')'; }).join(', ') + '</p>' : '') +
    '<div class="row">' + (canNext ? '<button class="btn primary" id="nx">Próximo nível</button>' : '') +
    '<button class="btn' + (canNext ? '' : ' primary') + '" id="again">Repetir este nível</button><button class="btn quiet" id="hm">Todos os níveis</button></div></div>';
  guide(null);
  document.getElementById('again').onclick = function () { start(i); };
  document.getElementById('hm').onclick = home;
  if (canNext) document.getElementById('nx').onclick = function () { level(i + 1); };
  (document.getElementById('nx') || document.getElementById('again')).focus();
}

/* ---------- Eventos globais ---------- */
app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-go]');
  if (b && !b.disabled) level(+b.dataset.go);
});
document.addEventListener('keydown', function (e) {
  var k = document.querySelector('.k[data-code="' + e.code + '"]');
  if (k) k.classList.add('down');
  if (!R) return;
  if (e.key === 'Escape') { if (R.step === 'pos') stepPos(R.i); else if (R.step === 'demo') stepDemo(R.i); else if (R.step === 'copy') begin(R.i, R.text, 'copy'); else start(R.i); return; }
  if (R.step === 'pos') { posKey(e); return; }
  if (R.step === 'demo' || R.done) return;
  if (e.key === 'Dead') { R.dead = true; paint(); }
  if (e.key === 'Tab') e.preventDefault();
  if (document.activeElement !== R.inp && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1) R.inp.focus({ preventScroll: true });
});
document.addEventListener('keyup', function (e) {
  var k = document.querySelector('.k[data-code="' + e.code + '"]');
  if (k) k.classList.remove('down');
});
window.addEventListener('blur', function () { document.querySelectorAll('.k.down').forEach(function (k) { k.classList.remove('down'); }); });

home();
})();
</script>
