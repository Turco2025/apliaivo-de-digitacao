<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dedo Certo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: uma coluna de trabalho centrada; a trilha de níveis é uma lista, o treino é um painel com texto em cima e teclado ABNT2 embaixo. */
:root {
  --bg: #eaf0ee;
  --surface: #fafcfb;
  --ink: #13272b;
  --muted: #55696c;
  --line: #cbd8d4;
  --accent: #0a7767;
  --accent-ink: #ffffff;
  --warn: #c2410c;
  --gold: #a9780a;
  --key: #ffffff;
  --f1: #d9488b; --f2: #e07b1a; --f3: #c2a000; --f4: #3e9b3e;
  --f5: #1a9aa8; --f6: #3b76e0; --f7: #7c5ce0; --f8: #b84cc4; --f9: #7d8b8d;
  --display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --text: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e191b; --surface: #16262a; --ink: #e3eeeb; --muted: #8fa6a5; --line: #2a4044;
    --accent: #3fc9b0; --accent-ink: #05221d; --warn: #ff8a5c; --gold: #f0c04a; --key: #1d3135;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e191b; --surface: #16262a; --ink: #e3eeeb; --muted: #8fa6a5; --line: #2a4044;
  --accent: #3fc9b0; --accent-ink: #05221d; --warn: #ff8a5c; --gold: #f0c04a; --key: #1d3135;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.55 var(--text);
}
.wrap {
  max-width: 880px; margin: 0 auto; padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 28px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.12; margin: 0; text-wrap: balance; }
p { margin: 0; }
#app { display: flex; flex-direction: column; gap: 22px; }
.num { font-variant-numeric: tabular-nums; }

/* topo */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font: 700 1.35rem var(--display); letter-spacing: -0.01em; }
.brand span { color: var(--accent); }
.top small { color: var(--muted); font-size: .85rem; letter-spacing: .04em; text-transform: uppercase; }

/* início */
.intro { display: flex; flex-direction: column; gap: 12px; }
.intro h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: -0.02em; }
.intro p { max-width: 62ch; color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 32px; margin: 0; padding: 14px 0; border-block: 1px solid var(--line); }
.stats div { display: flex; flex-direction: column; }
.stats dt { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stats dd { margin: 0; font: 700 1.5rem var(--display); }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 10px 18px; font-weight: 600;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); padding-inline: 4px; }
.btn.quiet:hover { color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.stage { display: flex; flex-direction: column; gap: 8px; }
.stage h2 { font-size: 1.05rem; display: flex; gap: 10px; align-items: baseline; }
.stage h2 small { font: 400 .85rem var(--text); color: var(--muted); }
.levels { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.levels li + li { border-top: 1px solid var(--line); }
.lv {
  width: 100%; border: 0; background: transparent; text-align: left;
  display: grid; grid-template-columns: 2.2rem minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
  padding: 11px 14px;
}
.lv:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.lv:disabled { cursor: not-allowed; color: var(--muted); }
.lv .n { font: 700 1.1rem var(--display); color: var(--muted); }
.lv.next .n { color: var(--accent); }
.lv .t { font-weight: 600; min-width: 0; }
.lv .t small { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }
.lv .s { font-size: .9rem; color: var(--muted); text-align: right; white-space: nowrap; }
.stars { color: var(--gold); letter-spacing: 2px; font-size: 1rem; }
.stars i { font-style: normal; opacity: .28; color: var(--muted); }
.foot { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; color: var(--muted); font-size: .9rem; }
.foot label { display: flex; gap: 8px; align-items: center; cursor: pointer; }

/* nível */
.crumb { color: var(--muted); font-size: .85rem; letter-spacing: .05em; text-transform: uppercase; }
.lvhead { display: flex; flex-direction: column; gap: 6px; }
.lvhead h1 { font-size: clamp(1.5rem, 4vw, 2.1rem); letter-spacing: -0.015em; }
.lesson { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 28px; }
.lesson > div { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.lesson h3 { font: 600 .75rem var(--text); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.lesson .tip h3 { color: var(--accent); }
.goal { color: var(--muted); font-size: .92rem; }
.goal b { color: var(--ink); }

.meters { display: flex; flex-wrap: wrap; gap: 6px 28px; align-items: baseline; }
.meters span { color: var(--muted); font-size: .85rem; }
.meters b { font: 700 1.25rem var(--display); color: var(--ink); margin-right: 4px; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }

.pad {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 20px 20px; min-height: 7rem;
}
.pad:focus-within { border-color: var(--accent); }
.txt { font: 400 clamp(1.1rem, 2.6vw, 1.45rem)/1.75 var(--mono); white-space: pre-wrap; overflow-wrap: break-word; }
.txt span { border-radius: 3px; }
.txt .done { color: var(--muted); opacity: .6; }
.txt .miss { text-decoration: underline; text-decoration-color: var(--warn); text-decoration-thickness: 2px; text-underline-offset: 4px; opacity: 1; }
.txt .cur { background: var(--accent); color: var(--accent-ink); }
.txt .cur.bad { background: var(--warn); }
#inp { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; font-size: 16px; cursor: text; }
.veil {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 12px;
  background: color-mix(in srgb, var(--surface) 86%, transparent); border-radius: 10px;
  font-weight: 600; pointer-events: none;
}
.pad:focus-within .veil { display: none; }
.hint { min-height: 1.6em; color: var(--muted); font-size: .95rem; }
.hint b { color: var(--ink); font-family: var(--mono); }

/* teclado ABNT2 */
.kbwrap { display: flex; flex-direction: column; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; }
.kb { display: flex; flex-direction: column; gap: clamp(2px, .6vw, 5px); }
.kr { display: flex; gap: clamp(2px, .6vw, 5px); }
.k {
  flex: var(--w) 1 0; min-width: 0; height: clamp(26px, 5.6vw, 46px);
  background: color-mix(in srgb, var(--fc, var(--f9)) 20%, var(--key));
  border: 1px solid color-mix(in srgb, var(--fc, var(--f9)) 45%, var(--line));
  border-radius: clamp(3px, .8vw, 6px);
  font: 600 clamp(9px, 1.9vw, 14px)/1 var(--mono);
  display: grid; place-items: center; position: relative; overflow: hidden;
}
.k sup { position: absolute; top: 3px; left: 4px; font-size: .72em; font-weight: 400; color: var(--muted); }
.k.sp { font-size: clamp(7px, 1.3vw, 11px); font-weight: 400; color: var(--muted); }
.k.home::after { content: ""; position: absolute; bottom: 3px; width: 30%; height: 2px; border-radius: 1px; background: currentColor; opacity: .55; }
.k.down { transform: translateY(1px); filter: brightness(.9); }
.k.go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.k.go sup { color: var(--accent-ink); }
.k.go2 { box-shadow: inset 0 0 0 2px var(--accent); }
.fingers { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; }
.fingers div { display: flex; gap: 4px; }
.fg {
  font-size: .72rem; padding: 2px 7px; border-radius: 99px;
  background: color-mix(in srgb, var(--fc) 20%, var(--key)); border: 1px solid color-mix(in srgb, var(--fc) 45%, var(--line));
}
.fg.on { background: var(--fc); color: #fff; border-color: var(--fc); font-weight: 700; }

/* resultado */
.result { display: flex; flex-direction: column; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px 20px; }
.result h2 { font-size: 1.5rem; }
.result .stars { font-size: 1.6rem; }
.result .stats { border: 0; padding: 0; }
.result p { max-width: 62ch; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

/* ---------- Gerador de exercícios ---------- */
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function lettersUpTo(i) { var s = ''; for (var x = 0; x <= i; x++) if (LEVELS[x].m === 'keys') s += LEVELS[x].k; return s; }
function allowedWords(set) { return WORDS.filter(function (w) { for (var i = 0; i < w.length; i++) if (set.indexOf(w[i]) < 0) return false; return true; }); }
function fill(len, next) {
  var out = [], size = 0, last = '';
  while (size < len) { var t = next(); if (t === last) continue; last = t; out.push(t); size += t.length + 1; }
  return out.join(' ');
}
function drill(nw, known, len) {
  var parts = [];
  nw.split('').forEach(function (c) { if (/[a-zç]/.test(c)) parts.push(c + c + c); });
  if (nw.length >= 2) { parts.push(nw[0] + nw[1] + nw[0], nw[1] + nw[0] + nw[1]); }
  var head = parts.join(' ');
  var rest = fill(Math.max(10, len - head.length), function () {
    var n = 2 + Math.floor(Math.random() * 3), g = '';
    for (var i = 0; i < n; i++) {
      var c = (!known || Math.random() < 0.6) ? pick(nw.split('')) : pick(known.split(''));
      if (/[,.;]/.test(c) && i === 0) c = pick((known || nw).replace(/[,.;]/g, '').split(''));
      g += c;
    }
    return g;
  });
  return (head ? head + ' ' : '') + rest;
}
function makeText(i) {
  var L = LEVELS[i], set, pool;
  if (L.m === 'keys') {
    set = lettersUpTo(i);
    var known = set.slice(0, set.length - L.k.length);
    var punct = L.k.replace(/[a-zç]/g, '');
    var all = allowedWords(set);
    pool = all.filter(function (w) { for (var j = 0; j < L.k.length; j++) if (w.indexOf(L.k[j]) >= 0) return true; return false; });
    if (pool.length < 5) return drill(L.k, known, L.n);
    var d = drill(L.k, known, Math.round(L.n * 0.4));
    var w = fill(Math.round(L.n * 0.6), function () {
      var x = Math.random() < 0.7 ? pick(pool) : pick(all);
      if (punct && Math.random() < 0.3) x += pick(punct.split(''));
      return x;
    });
    return d + ' ' + w.replace(/[,;]$/, '');
  }
  if (L.m === 'review') { pool = allowedWords(lettersUpTo(i)); return fill(L.n, function () { return pick(pool); }); }
  if (L.m === 'caps') return fill(L.n, function () { return pick(CAPS); });
  if (L.m === 'acc1') {
    pool = WORDS.filter(function (w) { return /[áéíóúãõ]/.test(w) && !/[âêôà]/.test(w); });
    var plain = allowedWords('abcdefghijklmnopqrstuvwxyzç');
    return fill(L.n, function () { return Math.random() < 0.75 ? pick(pool) : pick(plain); });
  }
  if (L.m === 'acc2') {
    pool = WORDS.filter(function (w) { return /[âêôà]/.test(w); });
    return fill(L.n, function () { return Math.random() < 0.4 ? pick(pool) : pick(ACC2); });
  }
  if (L.m === 'num') {
    var wd = ['dias', 'anos', 'reais', 'itens', 'horas', 'pessoas', 'casa', 'sala', 'km', 'de maio', 'de julho'];
    return fill(L.n, function () {
      var n = String(Math.floor(Math.random() * Math.pow(10, 1 + Math.floor(Math.random() * 4))));
      return Math.random() < 0.4 ? n + ' ' + pick(wd) : n;
    });
  }
  if (L.m === 'sym') return fill(L.n, function () { return pick(SYM); });
  var q = shuffle(SENT), out = '';
  while (out.length < L.n && q.length) out += (out ? ' ' : '') + q.pop();
  return out;
}

/* ---------- Progresso ---------- */
var KEY = 'dedo-certo-v1';
var S = { best: {}, all: false, kb: true };
try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); if (p && p.best) S = p; } } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function passed(i) { return !!(S.best[i] && S.best[i].stars > 0); }
function unlocked(i) { return S.all || i === 0 || passed(i - 1); }
function nextLevel() { for (var i = 0; i < LEVELS.length; i++) if (!passed(i)) return i; return LEVELS.length - 1; }
function starsHtml(n) { return '<span class="stars" aria-label="' + n + ' de 3 estrelas">' + '★★★'.slice(0, n) + '<i>' + '★★★'.slice(n) + '</i></span>'; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

var app = document.getElementById('app');
var R = null; /* estado do treino em andamento */

/* ---------- Tela inicial ---------- */
function home() {
  R = null;

  var h = '<section class="intro"><h1>Digite sem olhar, um nível de cada vez.</h1>' +
    '<p>São ' + LEVELS.length + ' níveis para o teclado brasileiro ABNT2. Cada nível explica quais dedos usar, dá uma técnica para ganhar velocidade e libera o próximo quando você atinge a meta de palavras por minuto (PPM) e de precisão.</p></section>' +
    '<dl class="stats"><div><dt>Seu nível</dt><dd class="num">' + (nx + 1) + '<small style="font-size:.9rem;color:var(--muted)"> de ' + LEVELS.length + '</small></dd></div>' +
    '<div><dt>Concluídos</dt><dd class="num">' + done + '</dd></div>' +
    '<div><dt>Melhor velocidade</dt><dd class="num">' + (top ? top + ' PPM' : '—') + '</dd></div></dl>' +
    '<div class="row"><button class="btn primary" data-go="' + nx + '">' + (done ? 'Continuar no nível ' : 'Começar pelo nível ') + (nx + 1) + '</button></div>';
  STAGES.forEach(function (name, s) {
    var items = '';
    LEVELS.forEach(function (L, i) {
      if (L.st !== s) return;
      var open = unlocked(i), b = S.best[i];
      items += '<li><button class="lv' + (i === nx ? ' next' : '') + '" data-go="' + i + '"' + (open ? '' : ' disabled') + '>' +
        '<span class="n num">' + (i + 1) + '</span>' +
        '<span class="t">' + esc(L.t) + '<small>Meta: ' + L.w + ' PPM com ' + L.a + '% de precisão</small></span>' +
        '<span class="s">' + (b ? starsHtml(b.stars) + '<br><span class="num">' + b.wpm + ' PPM</span>' : (open ? 'Aberto' : 'Bloqueado')) + '</span></button></li>';
    });
    h += '<section class="stage"><h2>' + name + '</h2><ul class="levels">' + items + '</ul></section>';
  });
  h += '<div class="foot"><label><input type="checkbox" id="all"' + (S.all ? ' checked' : '') + '> Liberar todos os níveis</label>' +
    '<button class="btn quiet" id="reset">Apagar meu progresso</button></div>';
  app.innerHTML = h;
  document.getElementById('all').onchange = function () { S.all = this.checked; save(); home(); };
  var rb = document.getElementById('reset'), armed = false;
  rb.onclick = function () {
    if (!armed) { armed = true; rb.textContent = 'Clique de novo para apagar tudo'; setTimeout(function () { armed = false; if (rb.isConnected) rb.textContent = 'Apagar meu progresso'; }, 4000); return; }
    S = { best: {}, all: false, kb: true }; save(); home();
  };
  window.scrollTo(0, 0);

/* ---------- Tela do nível ---------- */
function kbHtml() {
  var h = '<div class="kb" aria-hidden="true">';
  ROWS.forEach(function (row) {
    h += '<div class="kr">';
    row.forEach(function (k) {
      var sp = !k[4] || k[0] === 'Space';
      var lab = k[0] === 'Space' ? '' : (sp ? k[1] : k[1].toUpperCase());
      h += '<div class="k' + (sp ? ' sp' : '') + (k[0] === 'KeyF' || k[0] === 'KeyJ' ? ' home' : '') + '" data-code="' + k[0] + '" style="--w:' + k[3] + (k[4] ? ';--fc:var(--f' + k[4] + ')' : '') + '">' +
        (k[2] ? '<sup>' + esc(k[2]) + '</sup>' : '') + esc(lab) + '</div>';
    });
    h += '</div>';
  });
  h += '</div><div class="fingers" aria-hidden="true"><div>';
  for (var f = 1; f <= 8; f++) { h += '<span class="fg" data-f="' + f + '" style="--fc:var(--f' + f + ')">' + FSHORT[f] + '</span>'; if (f === 4) h += '</div><span class="fg" data-f="9" style="--fc:var(--f9)">' + FSHORT[9] + '</span><div>'; }
  return h + '</div></div>';
}
function level(i) {
  var L = LEVELS[i];
  app.innerHTML = '<div class="lvhead"><div class="row"><button class="btn quiet" id="back">← Todos os níveis</button></div>' +
    '<div class="crumb">Nível ' + (i + 1) + ' de ' + LEVELS.length + ' · ' + STAGES[L.st] + '</div><h1>' + esc(L.t) + '</h1></div>' +
    '<div class="lesson"><div><h3>O que é novo</h3><p>' + esc(L.l) + '</p></div>' +
    '<div class="tip"><h3>Para ganhar velocidade</h3><p>' + esc(L.d) + '</p></div></div>' +
    '<p class="goal">Meta para liberar o próximo nível: <b>' + L.w + ' PPM</b> com <b>' + L.a + '%</b> de precisão. A tecla errada não avança: corrija e siga.</p>' +
    '<div id="stage"></div>' +
    '<div class="kbwrap"><div id="kbbox">' + kbHtml() + '</div><div class="row" style="justify-content:center"><button class="btn quiet" id="kbt"></button></div></div>';
  document.getElementById('back').onclick = home;
  var kbt = document.getElementById('kbt'), box = document.getElementById('kbbox');
  function kbState() { box.hidden = !S.kb; kbt.textContent = S.kb ? 'Esconder o teclado (treino sem cola)' : 'Mostrar o teclado'; }
  kbt.onclick = function () { S.kb = !S.kb; save(); kbState(); if (R) R.inp.focus(); };
  kbState();
  start(i);
  window.scrollTo(0, 0);
}

function start(i) {
  var text = makeText(i);
  var stage = document.getElementById('stage');
  stage.innerHTML = '<div style="display:flex;flex-direction:column;gap:10px">' +
    '<div class="meters"><span><b class="num" id="mw">0</b>PPM</span><span><b class="num" id="ma">100%</b>precisão</span><span><b class="num" id="mt">0:00</b>tempo</span></div>' +
    '<div class="bar"><i id="mb"></i></div>' +
    '<div class="pad"><div class="txt" id="txt"></div>' +
    '<input id="inp" type="text" aria-label="Digite o texto mostrado" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">' +
    '<div class="veil">Clique aqui ou aperte qualquer tecla para começar</div></div>' +
    '<div class="hint" id="hint"></div></div>';
  var txt = document.getElementById('txt'), spans = [];
  for (var c = 0; c < text.length; c++) { var sp = document.createElement('span'); sp.textContent = text[c]; txt.appendChild(sp); spans.push(sp); }
  R = { i: i, text: text, spans: spans, idx: 0, ok: 0, err: 0, miss: {}, t0: 0, dead: false, used: 0, done: false,
        inp: document.getElementById('inp'), timer: null };
  R.inp.addEventListener('input', onInput);
  R.inp.addEventListener('compositionend', function () { R.inp.value = ''; R.used = 0; });
  paint();
  R.inp.focus({ preventScroll: true });
}

function onInput(e) {
  if (!R || R.done) return;
  var inp = R.inp, v = inp.value.normalize('NFC');
  if (v.length < R.used) R.used = v.length;
  var fresh = v.slice(R.used);
  if (e.isComposing) {
    if (fresh && DEADS_SET.indexOf(fresh[fresh.length - 1]) >= 0) return; /* acento esperando a letra */
    R.used = v.length;
  } else { inp.value = ''; R.used = 0; }
  for (var j = 0; j < fresh.length; j++) if (!type(fresh[j])) break;
  R.dead = false;
  paint();
  if (R.idx >= R.text.length) finish();
}
var DEADS_SET = ['´', '`', '~', '^', '¨'];

function type(ch) {
  if (R.idx >= R.text.length) return false;
  if (!R.t0) { R.t0 = performance.now(); R.timer = setInterval(meters, 400); }
  if (ch === '\u00a0') ch = ' ';
  var want = R.text[R.idx], sp = R.spans[R.idx];
  if (ch === want) { R.ok++; sp.className = 'done' + (sp.dataset.m ? ' miss' : ''); R.idx++; return true; }
  R.err++; R.miss[want] = (R.miss[want] || 0) + 1; sp.dataset.m = '1'; R.bad = true;
  return false;
}

function stats() {
  var min = R.t0 ? (performance.now() - R.t0) / 60000 : 0;
  var tot = R.ok + R.err;
  return { wpm: min > 0 ? Math.round(R.idx / 5 / min) : 0, acc: tot ? Math.round(R.ok / tot * 100) : 100, sec: Math.round(min * 60) };
}
function meters() {
  if (!R || !document.getElementById('mw')) return;
  var s = stats();
  document.getElementById('mw').textContent = s.wpm;
  document.getElementById('ma').textContent = s.acc + '%';
  document.getElementById('mt').textContent = Math.floor(s.sec / 60) + ':' + ('0' + s.sec % 60).slice(-2);
  document.getElementById('mb').style.width = (R.idx / R.text.length * 100) + '%';
}

function paint() {
  if (!R) return;
  var cur = R.spans[R.idx];
  R.spans.forEach(function (s) { if (s.classList.contains('cur')) s.className = ''; });
  if (cur) {
    cur.className = 'cur' + (R.bad ? ' bad' : '');
    if (R.bad) { var c0 = cur; setTimeout(function () { c0.classList.remove('bad'); }, 220); }
    if (cur.scrollIntoView && (cur.getBoundingClientRect().bottom > innerHeight || cur.getBoundingClientRect().top < 0)) cur.scrollIntoView({ block: 'center' });
  }
  R.bad = false;
  meters();
  /* teclado e dica */
  var keys = document.querySelectorAll('.k'), fgs = document.querySelectorAll('.fg'), hint = document.getElementById('hint');
  keys.forEach(function (k) { k.classList.remove('go', 'go2'); });
  fgs.forEach(function (f) { f.classList.remove('on'); });
  if (!cur) { hint.textContent = ''; return; }
  var ch = R.text[R.idx], info = keyInfo(ch);
  if (!info) { hint.textContent = ''; return; }
  var step = (info.dead && !R.dead) ? info.dead : info.main;
  mark(step.code, 'go');
  if (step.shift) mark(step.finger <= 4 ? 'ShiftRight' : 'ShiftLeft', 'go');
  if (info.dead && !R.dead) mark(info.main.code, 'go2');
  fgs.forEach(function (f) { if (+f.dataset.f === step.finger) f.classList.add('on'); });
  function desc(k) { return (k.shift ? 'Shift ' + (k.finger <= 4 ? 'direito' : 'esquerdo') + ' + ' : '') + '<b>' + esc(k.label) + '</b> (' + FINGER[k.finger] + ')'; }
  hint.innerHTML = info.dead
    ? 'Para <b>' + esc(ch) + '</b>: primeiro ' + desc(info.dead) + ', depois ' + desc(info.main)
    : 'Próxima tecla: ' + desc(info.main);
  function mark(code, cls) { var el = document.querySelector('.k[data-code="' + code + '"]'); if (el) el.classList.add(cls); }
}

function finish() {
  R.done = true; clearInterval(R.timer);
  var s = stats(), L = LEVELS[R.i], i = R.i;
  var ok = s.wpm >= L.w && s.acc >= L.a, stars = 0;
  if (ok) { stars = 1; if (s.wpm >= L.w * 1.25 && s.acc >= L.a + 2) stars = 2; if (s.wpm >= L.w * 1.5 && s.acc >= 98) stars = 3; }
  var b = S.best[i];
  if (!b || stars > b.stars || (stars === b.stars && s.wpm > b.wpm)) { S.best[i] = { wpm: s.wpm, acc: s.acc, stars: stars }; save(); }
  var worst = Object.keys(R.miss).sort(function (a, c) { return R.miss[c] - R.miss[a]; }).slice(0, 4);
  var last = i === LEVELS.length - 1, title, msg;
  if (ok && last) { title = 'Nível máximo concluído'; msg = 'Você chegou ao topo da trilha. Para manter o ritmo, repita este nível de vez em quando: o texto muda a cada tentativa.'; }
  else if (ok) { title = 'Meta atingida'; msg = stars === 3 ? 'Três estrelas. Você está pronto para o próximo nível.' : 'O próximo nível está liberado. Para mais estrelas, repita com mais velocidade mantendo a precisão.'; }
  else if (s.acc < L.a) { title = 'Ainda não: faltou precisão'; msg = 'Sua precisão foi de ' + s.acc + '% e a meta é ' + L.a + '%. Repita mais devagar, de propósito. Quando os erros somem, a velocidade sobe sem esforço.'; }
  else { title = 'Ainda não: faltou velocidade'; msg = 'Você fez ' + s.wpm + ' PPM e a meta é ' + L.w + '. A precisão está boa, então mantenha o toque e busque um ritmo contínuo, sem pausas entre as palavras.'; }
  var canNext = !last && unlocked(i + 1);
  document.getElementById('stage').innerHTML = '<div class="result" role="status"><div>' + starsHtml(stars) + '<h2>' + title + '</h2></div>' +
    '<dl class="stats"><div><dt>Velocidade</dt><dd class="num">' + s.wpm + ' PPM</dd></div><div><dt>Precisão</dt><dd class="num">' + s.acc + '%</dd></div>' +
    '<div><dt>Tempo</dt><dd class="num">' + Math.floor(s.sec / 60) + ':' + ('0' + s.sec % 60).slice(-2) + '</dd></div><div><dt>Erros</dt><dd class="num">' + R.err + '</dd></div></dl>' +
    '<p>' + msg + '</p>' +
    (worst.length ? '<p class="goal">Teclas que mais custaram: ' + worst.map(function (c) { return '<b style="font-family:var(--mono)">' + (c === ' ' ? 'espaço' : esc(c)) + '</b> (' + R.miss[c] + ')'; }).join(', ') + '</p>' : '') +
    '<div class="row">' + (canNext ? '<button class="btn primary" id="nx">Próximo nível</button>' : '') +
    '<button class="btn' + (canNext ? '' : ' primary') + '" id="again">Repetir este nível</button><button class="btn quiet" id="hm">Todos os níveis</button></div></div>';
  document.querySelectorAll('.k').forEach(function (k) { k.classList.remove('go', 'go2'); });
  document.getElementById('again').onclick = function () { start(i); };
  document.getElementById('hm').onclick = home;
  if (canNext) document.getElementById('nx').onclick = function () { level(i + 1); };
  (document.getElementById('nx') || document.getElementById('again')).focus();
}

/* ---------- Eventos globais ---------- */
app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-go]');
  if (b && !b.disabled) level(+b.dataset.go);
});
document.addEventListener('keydown', function (e) {
  var k = document.querySelector('.k[data-code="' + e.code + '"]');
  if (k) k.classList.add('down');
  if (!R) return;
  if (e.key === 'Escape') { start(R.i); return; }
  if (R.done) return;
  if (e.key === 'Dead') { R.dead = true; paint(); }
  if (e.key === 'Tab') e.preventDefault();
  if (document.activeElement !== R.inp && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1) R.inp.focus({ preventScroll: true });
});
document.addEventListener('keyup', function (e) {
  var k = document.querySelector('.k[data-code="' + e.code + '"]');
  if (k) k.classList.remove('down');
});
window.addEventListener('blur', function () { document.querySelectorAll('.k.down').forEach(function (k) { k.classList.remove('down'); }); });

home();
})();
</script>
